# 매일 03:00(한국 시간)에 어제 하루 스트레스 점수를 모든 사용자에 대해 계산해 저장한다.
# 저장소 Settings > Secrets and variables > Actions에 SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY가 있어야 한다.
name: Daily stress scores

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 03:00 KST
  workflow_dispatch:
    inputs:
      date:
        description: "계산할 날짜 (YYYY-MM-DD). 비우면 어제"
        required: false

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Calculate and save scores
        run: node scripts/dailyStressBatch.js
        env:
          # 입력값은 명령줄에 바로 넣지 않고 환경변수로 넘긴다(스크립트가 날짜 형식을 검사).
          BATCH_DATE: ${{ inputs.date }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
